<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Leakage Optimization Dashboard</title>
    <!-- We use Chart.js from a CDN because it's lightweight and perfect for rapid prototyping -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #2b2b36;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #4da8da;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .chart-container {
            position: relative;
            height: 600px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Quantum Leakage Optimization</h1>
    <p class="subtitle">Log(Transmission Probability) vs. Barrier Width for Sub-5nm Architectures</p>
    
    <div class="chart-container">
        <canvas id="tunnelingChart"></canvas>
    </div>
</div>

<script>
    // To prevent browser CORS (Cross-Origin Resource Sharing) security errors when opening local files 
    // directly without a web server, I embedded the JSON data directly into the Javascript.
    const rawData = {
  "Rectangular": [-0.836,-1.075,-1.317,-1.561,-1.806,-2.051,-2.297,-2.542,-2.788,-3.034,-3.280,-3.526,-3.772,-4.018,-4.264,-4.509,-4.755,-5.001,-5.247,-5.493,-5.739,-5.985,-6.231,-6.477,-6.723,-6.969,-7.215,-7.461,-7.707,-7.953,-8.198,-8.444,-8.690,-8.936,-9.182,-9.428,-9.674,-9.920,-10.166,-10.412,-10.658,-10.904,-11.150,-11.395,-11.641,-11.887],
  "Parabolic": [-0.464,-0.618,-0.778,-0.943,-1.111,-1.281,-1.452,-1.624,-1.796,-1.969,-2.143,-2.317,-2.491,-2.665,-2.840,-3.014,-3.189,-3.364,-3.539,-3.715,-3.890,-4.065,-4.241,-4.416,-4.592,-4.767,-4.943,-5.119,-5.295,-5.470,-5.646,-5.822,-5.998,-6.174,-6.350,-6.526,-6.702,-6.878,-7.054,-7.230,-7.406,-7.582,-7.758,-7.934,-8.110,-8.286],
  "Triangular": [-0.291,-0.398,-0.514,-0.635,-0.761,-0.890,-1.021,-1.154,-1.289,-1.424,-1.560,-1.696,-1.833,-1.969,-2.107,-2.244,-2.381,-2.518,-2.656,-2.793,-2.931,-3.068,-3.206,-3.343,-3.480,-3.618,-3.755,-3.892,-4.030,-4.167,-4.304,-4.441,-4.578,-4.715,-4.852,-4.989,-5.126,-5.263,-5.400,-5.537,-5.673,-5.810,-5.947,-6.083,-6.220,-6.356],
  "Gaussian": [-0.392,-0.528,-0.671,-0.820,-0.972,-1.126,-1.282,-1.439,-1.598,-1.756,-1.916,-2.075,-2.235,-2.395,-2.555,-2.715,-2.876,-3.036,-3.196,-3.357,-3.518,-3.678,-3.839,-3.999,-4.160,-4.321,-4.481,-4.642,-4.803,-4.963,-5.124,-5.284,-5.445,-5.605,-5.766,-5.926,-6.087,-6.247,-6.408,-6.568,-6.728,-6.889,-7.049,-7.209,-7.369,-7.530],
  "Exponential": [-0.227,-0.315,-0.411,-0.515,-0.623,-0.735,-0.850,-0.967,-1.085,-1.205,-1.325,-1.446,-1.567,-1.689,-1.810,-1.932,-2.054,-2.175,-2.297,-2.418,-2.539,-2.660,-2.781,-2.902,-3.022,-3.142,-3.263,-3.383,-3.503,-3.622,-3.742,-3.861,-3.980,-4.100,-4.219,-4.337,-4.456,-4.575,-4.693,-4.811,-4.930,-5.048,-5.166,-5.283,-5.401,-5.519],
  "widths": [0.5,0.6,0.7,0.8,0.9,1.0,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,2.0,2.1,2.2,2.3,2.4,2.5,2.6,2.7,2.8,2.9,3.0,3.1,3.2,3.3,3.4,3.5,3.6,3.7,3.8,3.9,4.0,4.1,4.2,4.3,4.4,4.5,4.6,4.7,4.8,4.9,5.0]
    };

    const ctx = document.getElementById('tunnelingChart').getContext('2d');
    
    // Formatting the widths strictly to 1 decimal place for the X-axis
    const formattedWidths = rawData.widths.map(w => w.toFixed(1));

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: formattedWidths,
            datasets: [
                {
                    label: 'Rectangular (Baseline)',
                    data: rawData.Rectangular,
                    borderColor: '#ff4c4c', // Red
                    backgroundColor: 'rgba(255, 76, 76, 0.1)',
                    borderWidth: 3,
                    fill: false,
                    tension: 0.1
                },
                {
                    label: 'Gaussian',
                    data: rawData.Gaussian,
                    borderColor: '#4da8da', // Blue
                    borderWidth: 2,
                    fill: false,
                    tension: 0.4
                },
                {
                    label: 'Parabolic',
                    data: rawData.Parabolic,
                    borderColor: '#ffcc00', // Yellow
                    borderWidth: 2,
                    fill: false,
                    tension: 0.4
                },
                {
                    label: 'Triangular',
                    data: rawData.Triangular,
                    borderColor: '#99cc33', // Green
                    borderWidth: 2,
                    fill: false,
                    tension: 0.4
                },
                {
                    label: 'Exponential (Max Leakage)',
                    data: rawData.Exponential,
                    borderColor: '#cc66ff', // Purple
                    borderWidth: 3,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: 'Quantum Tunneling Probability vs. Barrier Width',
                    color: '#f5f5f5',
                    font: { size: 18 }
                },
                legend: {
                    labels: { color: '#f5f5f5', font: { size: 14 } }
                },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Barrier Width (W)',
                        color: '#a0a0a0',
                        font: { size: 14 }
                    },
                    ticks: { color: '#a0a0a0' },
                    grid: { color: '#3b3b4a' }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Log10(Transmission Probability T)',
                        color: '#a0a0a0',
                        font: { size: 14 }
                    },
                    ticks: { color: '#a0a0a0' },
                    grid: { color: '#3b3b4a' }
                }
            }
        }
    });
</script>
</body>
</html>
